services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      DATABASE_URL: sqlite:////app/data/becaradar.db
    volumes:
      - becaradar_data:/app/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: docker/Dockerfile.bot
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      DATABASE_URL: sqlite:////app/data/becaradar.db
      BACKEND_API_URL: http://backend:8000/api/v1
    depends_on:
      - backend
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: docker/Dockerfile.scraper
    env_file:
      - ${ENV_FILE:-.env.development}
    environment:
      PYTHONPATH: /app/backend
      DATABASE_URL: sqlite:////app/data/becaradar.db
      BACKEND_API_URL: http://backend:8000/api/v1
    volumes:
      - becaradar_data:/app/data

volumes:
  becaradar_data:
