version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - ${ENV_FILE:-.env.development}
    volumes:
      - becaradar_data:/app/data
    restart: unless-stopped

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile.bot
    env_file:
      - ${ENV_FILE:-.env.development}
    depends_on:
      - backend
    restart: unless-stopped

  scraper:
    build:
      context: .
      dockerfile: scraper/Dockerfile.scraper
    env_file:
      - ${ENV_FILE:-.env.development}
    volumes:
      - becaradar_data:/app/data
    # No tiene restart policy porque es un proceso que termina (One-off)

volumes:
  becaradar_data: